name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Immutable container reference to deploy"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Deploy immutable image
        env:
          CONTAINER_IMAGE: ${{ inputs.image }}
          STAGING_DEPLOY_COMMAND: ${{ secrets.STAGING_DEPLOY_COMMAND }}
        run: |
          test -n "$STAGING_DEPLOY_COMMAND"
          eval "$STAGING_DEPLOY_COMMAND"
