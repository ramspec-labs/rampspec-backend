name: Backend bug
description: Report a reproducible backend defect using synthetic data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, private endpoints, or vulnerability details.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and which service or package was involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps using only synthetic or public-safe data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: validation_scope
    attributes:
      label: Observed in
      options:
        - Fixture tests
        - Local environment
        - Controlled testnet
        - Pubnet
    validations:
      required: true
